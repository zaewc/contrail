name: Deploy contrail (SSH Key method)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy via SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Run deployment
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /home/ubuntu/contrail
          git fetch origin main
          git pull origin main
          pnpm install
          pnpm build
          sudo rm -rf /var/www/contrail/*
          sudo cp -r apps/web/dist/* /var/www/contrail/
          sudo chown -R www-data:www-data /var/www/contrail
          pm2 restart contrail-api || (cd /home/ubuntu/contrail/apps/api && pm2 start "pnpm run start" --name "contrail-api")
          pm2 save
          sudo nginx -t
          sudo systemctl reload nginx
          echo "✅ Deployment complete!"
          EOF
